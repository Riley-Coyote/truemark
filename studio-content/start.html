<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>TrueMark — Opening the studio</title><style>body{margin:0;min-height:100svh;display:grid;place-items:center;background:linear-gradient(#f7f3fb,#e4d8f2);color:#241a4a;font:16px/1.6 Helvetica,Arial,sans-serif}main{padding:2rem;max-width:34rem}p{opacity:.7}h1{font-size:2rem;font-weight:400;letter-spacing:-.04em}a{color:inherit}progress{accent-color:#241a4a;width:12rem;height:3px}</style></head><body><main><p>TRUEMARK BIOLABS</p><h1 id="title">Opening the studio.</h1><p id="status" role="status">Preparing the collection for your browser…</p><progress aria-label="Opening studio"></progress><p><a href="/truemark/#/">Open the website</a></p></main><script>(async()=>{const base="/truemark/studio/",version="e86e918ca64ce47e";try{if(!('serviceWorker'in navigator))throw Error('Use a current browser with service workers enabled.');let next=new URL(new URLSearchParams(location.search).get('next')||base,location.origin);if(next.origin!==location.origin||!next.pathname.startsWith(base)||next.pathname.endsWith('/start.html'))next=new URL(base,location.origin);next.searchParams.set('studio',version);const wait=new Promise((resolve,reject)=>{const check=()=>{if(navigator.serviceWorker.controller&&new URL(navigator.serviceWorker.controller.scriptURL).searchParams.get('v')===version)resolve()};navigator.serviceWorker.addEventListener('controllerchange',check);setTimeout(()=>reject(Error('The collection did not finish loading. Reload this page to try again.')),25000);check()});await navigator.serviceWorker.register(base+'sw.js?v='+version,{scope:base,updateViaCache:'none'});await navigator.serviceWorker.ready;await wait;location.replace(next.href)}catch(e){document.getElementById('title').textContent='The studio needs a moment.';document.getElementById('status').textContent=e.message;document.querySelector('progress').hidden=true}})();</script></body></html>
