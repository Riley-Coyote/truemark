name: Deploy review to GitHub Pages

# Publishes the client review: the platform at the site's root, and the first
# design (as sent on 22 September, tag archive/07-pages-september-22) at
# /first-design/, so the link the client already has still reaches both.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # The working design branch contains private client material and is never a publish source.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: npm ci
      - name: Build the platform
        env:
          # The shared notes behind the review layer. Without them, notes stay on each device.
          VITE_REVIEW_SUPABASE_URL: ${{ vars.REVIEW_SUPABASE_URL }}
          VITE_REVIEW_SUPABASE_ANON_KEY: ${{ vars.REVIEW_SUPABASE_ANON_KEY }}
        run: npm run build
      - name: Build the live platform
        env:
          VITE_PLATFORM: live
          VITE_REVIEW_SUPABASE_URL: ${{ vars.REVIEW_SUPABASE_URL }}
          VITE_REVIEW_SUPABASE_ANON_KEY: ${{ vars.REVIEW_SUPABASE_ANON_KEY }}
        run: npm run build:live -- --emptyOutDir
      - name: Build the launch site
        env:
          VITE_PLATFORM: live
          VITE_LAUNCH: '1'
          VITE_ROUTER: path
          VITE_REVIEW_SUPABASE_URL: ${{ vars.REVIEW_SUPABASE_URL }}
          VITE_REVIEW_SUPABASE_ANON_KEY: ${{ vars.REVIEW_SUPABASE_ANON_KEY }}
        run: npm run build:launch -- --emptyOutDir --base /truemark/launch/
      - name: Verify launch integration and browser isolation
        env:
          WP27_LAUNCH_DIR: dist/launch
        # These checks run from site files only. Historical comparison suites stay
        # local: their private reference commits must never be pushed to run CI.
        run: |
          node --test scripts/auth-navigation.test.mjs scripts/release-config.test.mjs scripts/browser-secrets.test.mjs scripts/shop-gate.test.mjs
          node scripts/assistant-bundle-audit.mjs dist
      - name: Write Pages fallback
        run: node scripts/pages-404.mjs
      - name: Build the first design
        run: |
          git worktree add ../first-design archive/07-pages-september-22
          cd ../first-design
          npm ci
          npm run build
          mv dist "$GITHUB_WORKSPACE/dist/first-design"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
