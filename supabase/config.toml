# Local development only. Never links to or changes the hosted project.
project_id = "truemark-platform-local"

[api]
enabled = true
port = 55421
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55422
shadow_port = 55420
major_version = 17

[db.seed]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 55423
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 55424

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:5300/"
additional_redirect_urls = ["http://127.0.0.1:5300/**", "http://localhost:5300/**"]
minimum_password_length = 10

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
max_frequency = "1s"

[auth.rate_limit]
email_sent = 100
sign_in_sign_ups = 100

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8083

[analytics]
enabled = false

[functions.payments]
verify_jwt = false
[functions.shipping]
verify_jwt = false
[functions.messages]
verify_jwt = false
[functions.uploads]
verify_jwt = false
[functions.assistant]
verify_jwt = false

[experimental]
stack = true
